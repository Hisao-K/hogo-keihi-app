<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>保護活動経費</title>
  <meta name="theme-color" content="#E7741D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="保護活動経費">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="bar noprint">
    <h1>保護活動経費</h1>
    <span id="me" class="who"></span>
    <button id="setBtn" class="close" type="button" hidden>設定</button>
    <button id="logout" class="close" type="button" hidden>閉じる</button>
  </header>
  <div class="offline noprint" id="offline" hidden>電波がありません。つながると、登録や読み込みができます。</div>

  <main>
    <!-- 設定：この団体の GAS の URL（接続先）がまだない -->
    <section id="view-setup" class="view" hidden>
      <h2>はじめの設定</h2>
      <p>Apps Script で公開した URL（…/exec で終わるもの）をブラウザで開き、「アプリを開く」を押してください。開けないときは、その URL をここに貼り付けてください。</p>
      <label class="field">接続先の URL
        <input id="setup-url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      </label>
      <button id="setup-save" class="primary" type="button">保存する</button>
      <p id="setup-msg" class="msg"></p>
    </section>

    <!-- ログイン -->
    <section id="view-login" class="view" hidden>
      <h2>ログイン</h2>
      <p>登録された Google アカウントでログインしてください。登録された人は、この団体の猫・経費・日記を見られます。</p>
      <div id="gsi-button"></div>
      <p id="login-msg" class="msg"></p>
      <p id="login-api" class="hint"></p>
    </section>

    <!-- メイン -->
    <nav class="tabs noprint" id="tabs" role="tablist" hidden>
      <button type="button" role="tab" data-tab="cats" aria-selected="true">🐈 保護猫</button>
      <button type="button" role="tab" data-tab="add" aria-selected="false">＋ 登録</button>
      <button type="button" role="tab" data-tab="list" aria-selected="false">≡ 一覧</button>
      <button type="button" role="tab" data-tab="report" aria-selected="false">📄 帳票</button>
    </nav>
    <div id="app" hidden></div>
  </main>

  <div id="modal"></div>
  <div id="dialog"></div>

  <script src="app.js"></script>
</body>
</html>
